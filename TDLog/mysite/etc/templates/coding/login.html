{% extends 'coding/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="connexion">
  <div>
    <h1 class="titre-page">Log in</h1>
    <form method="post" class="form">{% csrf_token %}
      <div class="champ"><label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required autofocus></div>
      <div class="champ"><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required></div>
      <div><button class="btn plein" type="submit">Log in</button></div>
    </form>
    <p class="muet">No account yet? <a href="{% url 'coding:register' %}">Register</a>.</p>
  </div>
  <div class="grille" style="--cols:4" aria-hidden="true">
    <span class="cell pleine"><i>1</i>L</span><span class="cell pleine">O</span><span class="cell pleine">G</span><span class="cell noire"></span>
    <span class="cell noire"></span><span class="cell"><i>2</i></span><span class="cell pleine">I</span><span class="cell"></span>
    <span class="cell"><i>3</i></span><span class="cell"></span><span class="cell pleine">N</span><span class="cell noire"></span>
  </div>
</div>
{% endblock %}
