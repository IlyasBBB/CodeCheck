services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py create_sample_data && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-codecheck}
      POSTGRES_USER: ${POSTGRES_USER:-codecheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecheck-dev}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecheck}
      POSTGRES_USER: ${POSTGRES_USER:-codecheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecheck-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
